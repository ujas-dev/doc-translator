name: doc-translator-dev

services:
  app-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: doc-translator-app-dev
    restart: unless-stopped
    depends_on:
      db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_started
      libretranslate-dev:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "1"
      SECRET_KEY: dev-secret-key-not-for-production
      DATABASE_URL: postgres://doctranslator:doctranslator@db-dev:5432/doctranslator_dev
      REDIS_URL: redis://redis-dev:6379/0
      CELERY_BROKER_URL: redis://redis-dev:6379/1
      CELERY_RESULT_BACKEND: redis://redis-dev:6379/2
      LIBRETRANSLATE_URL: http://libretranslate-dev:5000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: translategemma:4b
      MEM0_URL: http://mem0:8000
      QDRANT_URL: http://qdrant:6333
      TZ: Asia/Kolkata
    volumes:
      - ..:/workspace:cached
      - ../media:/workspace/media
    ports:
      - "8010:8000"
      - "5678:5678"
    networks:
      - doc-translator-dev

  db-dev:
    image: pgvector/pgvector:pg16
    container_name: doc-translator-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: doctranslator
      POSTGRES_PASSWORD: doctranslator
      POSTGRES_DB: doctranslator_dev
    volumes:
      - doc-translator-dev-postgres:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctranslator -d doctranslator_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - doc-translator-dev

  redis-dev:
    image: redis:7-alpine
    container_name: doc-translator-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - doc-translator-dev

  libretranslate-dev:
    image: libretranslate/libretranslate:latest
    container_name: doc-translator-libretranslate-dev
    restart: unless-stopped
    environment:
      LT_UPDATE_MODELS: "true"
      LT_API_KEYS: "false"
    volumes:
      - ../data/dev/libretranslate:/home/libretranslate/.local
    ports:
      - "5001:5000"
    networks:
      - doc-translator-dev

networks:
  doc-translator-dev:
    driver: bridge

volumes:
  doc-translator-dev-postgres:
