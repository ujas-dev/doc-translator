{% extends 'base.html' %}

{% block title %}Upload Batch - Doc Translator{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Upload Batch</h1>
        <p class="text-gray-600 dark:text-gray-400">Upload a ZIP file containing multiple documents to translate.</p>
    </div>

    <form method="post" enctype="multipart/form-data" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6">
        {% csrf_token %}

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">ZIP File</label>
            <input type="file" name="zip_file" accept=".zip" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-4 py-2.5 focus:ring-2 focus:ring-primary-500 focus:border-transparent">
            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Supported formats: PDF, DOCX, TXT, XLSX, PPTX, HTML, CSV, MD, Images</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Source Language</label>
                <select name="source_language" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-4 py-2.5 focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                    <option value="auto">Auto-detect</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="gu">Gujarati</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Target Language</label>
                <select name="target_language" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-4 py-2.5 focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                    <option value="hi">Hindi</option>
                    <option value="gu">Gujarati</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Translation Style</label>
            <select name="style_mode" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-4 py-2.5 focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                <option value="fluid">Fluid (Natural)</option>
                <option value="faithful">Faithful (Literal)</option>
                <option value="creative">Creative (Marketing)</option>
                <option value="formal">Formal (Business)</option>
                <option value="casual">Casual (Informal)</option>
            </select>
        </div>

        <div class="mb-6">
            <label class="flex items-center">
                <input type="checkbox" name="bilingual" class="w-4 h-4 text-primary-600 bg-white dark:bg-gray-700 border-gray-300 dark:border-gray-600 rounded focus:ring-primary-500">
                <span class="ml-2 text-sm font-medium text-gray-700 dark:text-gray-300">Bilingual Output</span>
            </label>
        </div>

        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 px-6 rounded-lg transition-colors">
            <i class="fas fa-upload mr-2"></i> Upload & Process
        </button>
    </form>
</div>
{% endblock %}
