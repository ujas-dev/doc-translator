{% extends "base.html" %}

{% block title %}Welcome to Doc Translator{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
    <div class="max-w-lg w-full text-center">
        <div class="w-20 h-20 bg-primary-100 dark:bg-primary-900 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-language text-3xl text-primary-600 dark:text-primary-400"></i>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">
            Welcome to Doc Translator!
        </h1>

        <p class="text-gray-600 dark:text-gray-400 mb-8 text-lg">
            Translate documents while preserving their original layout.
            Let's get you set up in just a few steps.
        </p>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="step" value="welcome">
            <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white px-8 py-3 rounded-lg font-medium text-lg transition-colors">
                Get Started
                <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </form>

        <p class="text-sm text-gray-500 dark:text-gray-400 mt-6">
            <a href="{% url 'onboarding_skip' %}" class="hover:text-primary-600">Skip for now</a>
        </p>
    </div>
</div>
{% endblock %}
