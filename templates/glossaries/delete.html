{% extends "base.html" %}
{% block title %}Delete {{ glossary.name }} - Doc Translator{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-8 text-center">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-100 dark:bg-red-900/50 flex items-center justify-center">
            <i class="fas fa-trash text-red-500 text-2xl"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Delete Glossary</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-6">Are you sure you want to delete <strong>{{ glossary.name }}</strong>? This action cannot be undone.</p>
        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 px-6 rounded-lg transition-colors">Delete</button>
            <a href="{% url 'glossary_detail' pk=glossary.pk %}" class="px-6 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
