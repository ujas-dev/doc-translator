{% extends "base.html" %}

{% block title %}Leave Team - {{ team.name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="mb-8">
        <a href="{% url 'team_detail' team_id=team.pk %}" class="text-primary-600 hover:text-primary-700 text-sm">
            <i class="fas fa-arrow-left mr-1"></i> Back to {{ team.name }}
        </a>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mt-4">Leave Team</h1>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-yellow-100 dark:bg-yellow-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-sign-out-alt text-2xl text-yellow-600 dark:text-yellow-400"></i>
            </div>
            <p class="text-gray-700 dark:text-gray-300">
                Are you sure you want to leave <strong>{{ team.name }}</strong>?
            </p>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">
                You will lose access to all team resources.
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end space-x-4">
                <a href="{% url 'team_detail' team_id=team.pk %}" class="px-4 py-2 text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">
                    Cancel
                </a>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                    Leave Team
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
