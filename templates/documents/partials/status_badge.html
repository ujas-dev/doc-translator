{% if status == 'completed' %}
    <span class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-medium bg-green-100 dark:bg-green-900/50 text-green-800 dark:text-green-200">
        <i class="fas fa-check-circle mr-1.5"></i> Completed
    </span>
{% elif status == 'processing' or status == 'queued' %}
    <span class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-medium bg-yellow-100 dark:bg-yellow-900/50 text-yellow-800 dark:text-yellow-200">
        <i class="fas fa-spinner fa-spin mr-1.5"></i> {{ status|title }}
    </span>
{% elif status == 'failed' %}
    <span class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-medium bg-red-100 dark:bg-red-900/50 text-red-800 dark:text-red-200">
        <i class="fas fa-exclamation-circle mr-1.5"></i> Failed
    </span>
{% endif %}
