name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff>=0.5
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doctranslator
          POSTGRES_PASSWORD: doctranslator
          POSTGRES_DB: test_doctranslator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://doctranslator:doctranslator@localhost:5432/test_doctranslator
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      LIBRETRANSLATE_URL: http://localhost:5000
      OLLAMA_URL: http://localhost:11434
      OLLAMA_MODEL: translategemma:4b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t doc-translator:${{ github.sha }} .
      - name: Test image starts
        run: |
          docker run -d --name test-web \
            -e SECRET_KEY=ci-test \
            -e DEBUG=1 \
            -e DATABASE_URL=sqlite:///tmp/test.db \
            -e ALLOWED_HOSTS=localhost \
            -p 8000:8000 \
            doc-translator:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health/ || exit 1
          docker stop test-web
