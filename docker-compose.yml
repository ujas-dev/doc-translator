name: doc-translator

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-translator-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      libretranslate:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "0"
      SECRET_KEY: ${DOC_TRANSLATOR_SECRET_KEY}
      DATABASE_URL: postgres://${DOC_TRANSLATOR_DB_USER}:${DOC_TRANSLATOR_DB_PASSWORD}@db:5432/${DOC_TRANSLATOR_DB_NAME}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LIBRETRANSLATE_URL: http://libretranslate:5000
      LIBRETRANSLATE_API_KEY: ${DOC_TRANSLATOR_LIBRETRANSLATE_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${DOC_TRANSLATOR_OLLAMA_MODEL:-translategemma:4b}
      MEM0_URL: http://mem0:8000
      QDRANT_URL: http://qdrant:6333
      ALLOWED_HOSTS: ${DOC_TRANSLATOR_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${DOC_TRANSLATOR_CSRF_TRUSTED_ORIGINS:-http://localhost:8010}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "${DOC_TRANSLATOR_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${DOC_TRANSLATOR_WEB_MEMORY_LIMIT:-2G}
          cpus: "${DOC_TRANSLATOR_WEB_CPU_LIMIT:-2.0}"
    networks:
      - doc-translator-internal
      - backbone

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-translator-celery-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "0"
      SECRET_KEY: ${DOC_TRANSLATOR_SECRET_KEY}
      DATABASE_URL: postgres://${DOC_TRANSLATOR_DB_USER}:${DOC_TRANSLATOR_DB_PASSWORD}@db:5432/${DOC_TRANSLATOR_DB_NAME}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LIBRETRANSLATE_URL: http://libretranslate:5000
      LIBRETRANSLATE_API_KEY: ${DOC_TRANSLATOR_LIBRETRANSLATE_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${DOC_TRANSLATOR_OLLAMA_MODEL:-translategemma:4b}
      MEM0_URL: http://mem0:8000
      QDRANT_URL: http://qdrant:6333
      TZ: ${TZ:-Asia/Kolkata}
    command: celery -A config worker -l info --concurrency=2
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - doc-translator-internal
      - backbone

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-translator-celery-beat
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "0"
      SECRET_KEY: ${DOC_TRANSLATOR_SECRET_KEY}
      DATABASE_URL: postgres://${DOC_TRANSLATOR_DB_USER}:${DOC_TRANSLATOR_DB_PASSWORD}@db:5432/${DOC_TRANSLATOR_DB_NAME}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LIBRETRANSLATE_URL: http://libretranslate:5000
      LIBRETRANSLATE_API_KEY: ${DOC_TRANSLATOR_LIBRETRANSLATE_API_KEY:-}
      TZ: ${TZ:-Asia/Kolkata}
    command: celery -A config beat -l info
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - doc-translator-internal

  db:
    image: pgvector/pgvector:pg16
    container_name: doc-translator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOC_TRANSLATOR_DB_USER:-doctranslator}
      POSTGRES_PASSWORD: ${DOC_TRANSLATOR_DB_PASSWORD:-change_me_doctranslator}
      POSTGRES_DB: ${DOC_TRANSLATOR_DB_NAME:-doctranslator}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOC_TRANSLATOR_DB_USER:-doctranslator} -d ${DOC_TRANSLATOR_DB_NAME:-doctranslator}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - doc-translator-internal

  redis:
    image: redis:7-alpine
    container_name: doc-translator-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - doc-translator-internal

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: doc-translator-libretranslate
    restart: unless-stopped
    environment:
      LT_UPDATE_MODELS: "true"
      LT_LOAD_ONLY: ${DOC_TRANSLATOR_LT_LOAD_ONLY:-}
      LT_API_KEYS: ${DOC_TRANSLATOR_LT_API_KEYS:-true}
      LT_REQ_LIMIT: ${DOC_TRANSLATOR_LT_REQ_LIMIT:-100}
      LT_CHAR_LIMIT: ${DOC_TRANSLATOR_LT_CHAR_LIMIT:-5000}
    volumes:
      - ./data/libretranslate:/home/libretranslate/.local
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - doc-translator-internal

  # Ollama runs in the core stack (core/ollama/) on my-stack-backbone network.
  # Accessible as http://ollama:11434 from any container on the backbone network.
  # Models: translategemma:4b (translation), qwen2.5-coder:7b (code), etc.
  # To pull models: docker exec -it ollama ollama pull translategemma:4b

networks:
  doc-translator-internal:
    driver: bridge
  backbone:
    external: true
    name: ${CORE_NETWORK:-my-stack-backbone}
